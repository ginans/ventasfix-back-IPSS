services:
  mysql:
    image: mysql:8.0
    container_name: ventasfix_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ventasfix_db
      MYSQL_USER: ventasfix_user
      MYSQL_PASSWORD: ventasfix_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

