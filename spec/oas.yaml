openapi: 3.0.0
paths:
  /api/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Sesión iniciada con éxito.
        "401":
          description: Credenciales inválidas.
      summary: Iniciar sesión y obtener token JWT de acceso
      tags:
        - Autenticación
  /api/users:
    get:
      operationId: UsersController_findAll
      parameters: []
      responses:
        "200":
          description: Lista de usuarios obtenida.
      security: &a1
        - bearer: []
      summary: Listar todos los usuarios administradores
      tags: &a2
        - Usuarios
    post:
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserDto"
      responses:
        "201":
          description: Usuario creado exitosamente.
        "400":
          description: Datos inválidos o incompletos.
        "409":
          description: RUT o correo ya registrado.
      security: *a1
      summary: Crear un nuevo usuario administrador
      tags: *a2
  /api/users/{id}:
    get:
      operationId: UsersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Usuario encontrado.
        "404":
          description: Usuario no encontrado.
      security: *a1
      summary: Obtener usuario por ID
      tags: *a2
    put:
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: Usuario actualizado exitosamente.
        "404":
          description: Usuario no encontrado.
      security: *a1
      summary: Actualizar un usuario existente por ID
      tags: *a2
    delete:
      operationId: UsersController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Usuario eliminado exitosamente.
        "404":
          description: Usuario no encontrado.
      security: *a1
      summary: Eliminar un usuario por ID
      tags: *a2
  /api/products:
    get:
      operationId: ProductsController_findAll
      parameters: []
      responses:
        "200":
          description: Lista de productos obtenida.
      security: &a3
        - bearer: []
      summary: Listar todos los productos con estado de stock e IVA
      tags: &a4
        - Productos
    post:
      operationId: ProductsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductDto"
      responses:
        "201":
          description: Producto creado exitosamente.
        "400":
          description: Datos inválidos.
        "409":
          description: SKU ya registrado.
      security: *a3
      summary: Agregar un nuevo producto al catálogo
      tags: *a4
  /api/products/{id}:
    get:
      operationId: ProductsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Producto encontrado.
        "404":
          description: Producto no encontrado.
      security: *a3
      summary: Obtener producto por ID
      tags: *a4
    put:
      operationId: ProductsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductDto"
      responses:
        "200":
          description: Producto actualizado exitosamente.
        "404":
          description: Producto no encontrado.
      security: *a3
      summary: Actualizar un producto existente por ID
      tags: *a4
    delete:
      operationId: ProductsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Producto eliminado exitosamente.
        "404":
          description: Producto no encontrado.
      security: *a3
      summary: Eliminar un producto por ID
      tags: *a4
  /api/clients:
    get:
      operationId: ClientsController_findAll
      parameters: []
      responses:
        "200":
          description: Lista de clientes obtenida.
      security: &a5
        - bearer: []
      summary: Listar todos los clientes empresa
      tags: &a6
        - Clientes
    post:
      operationId: ClientsController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClientDto"
      responses:
        "201":
          description: Cliente registrado exitosamente.
        "400":
          description: Datos inválidos.
        "409":
          description: RUT de empresa ya registrado.
      security: *a5
      summary: Registrar un nuevo cliente empresa
      tags: *a6
  /api/clients/{id}:
    get:
      operationId: ClientsController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Cliente encontrado.
        "404":
          description: Cliente no encontrado.
      security: *a5
      summary: Obtener cliente por ID
      tags: *a6
    put:
      operationId: ClientsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClientDto"
      responses:
        "200":
          description: Cliente actualizado exitosamente.
        "404":
          description: Cliente no encontrado.
      security: *a5
      summary: Actualizar datos de cliente empresa por ID
      tags: *a6
    delete:
      operationId: ClientsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        "200":
          description: Cliente eliminado exitosamente.
        "404":
          description: Cliente no encontrado.
      security: *a5
      summary: Eliminar un cliente por ID
      tags: *a6
  /api/dashboard/stats:
    get:
      operationId: DashboardController_getStats
      parameters: []
      responses:
        "200":
          description: Estadísticas obtenidas con éxito.
      security:
        - bearer: []
      summary: Obtener métricas y contadores totales para el Dashboard
      tags:
        - Dashboard
info:
  title: Ventas Fix - API Backoffice
  description: API REST para el microservicio de gestión de usuarios, catálogo de
    productos con IVA y clientes empresa de Ventas Fix.
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          format: email
          example: admin@ventasfix.cl
          description: Correo electrónico institucional (@ventasfix.cl)
        password:
          type: string
          minLength: 6
          example: Admin1234!
          description: Contraseña de acceso
      required:
        - email
        - password
    CreateUserDto:
      type: object
      properties:
        rut:
          type: string
          example: 11.111.111-1
          description: RUT chileno del usuario administrador
        nombre:
          type: string
          example: Juan
          description: Nombre del usuario
        apellido:
          type: string
          example: Pérez
          description: Apellido del usuario
        email:
          type: string
          format: email
          pattern: ^[a-zA-Z0-9._%+-]+@ventasfix\.cl$
          example: jperez@ventasfix.cl
          description: Correo corporativo (debe terminar en @ventasfix.cl)
        password:
          type: string
          minLength: 6
          example: ClaveSegura2026!
          description: Contraseña para acceder al backoffice
      required:
        - rut
        - nombre
        - apellido
        - email
        - password
    UpdateUserDto:
      type: object
      properties:
        rut:
          type: string
          example: 11.111.111-1
          description: RUT chileno del usuario administrador
        nombre:
          type: string
          example: Juan
          description: Nombre del usuario
        apellido:
          type: string
          example: Pérez
          description: Apellido del usuario
        email:
          type: string
          format: email
          pattern: ^[a-zA-Z0-9._%+-]+@ventasfix\.cl$
          example: jperez@ventasfix.cl
          description: Correo corporativo (debe terminar en @ventasfix.cl)
        password:
          type: string
          minLength: 6
          example: NuevaClave2026!
          description: Nueva contraseña (opcional)
    CreateProductDto:
      type: object
      properties:
        sku:
          type: string
          example: FIX-101
          description: Código SKU único del producto
        nombre:
          type: string
          example: Esmeril Angular 4-1/2 850W
          description: Nombre comercial del producto
        descripcionCorta:
          type: string
          example: Esmeril angular de alta durabilidad para corte y desbaste.
          description: Descripción breve
        descripcionLarga:
          type: string
          example: Herramienta eléctrica profesional con motor sellado contra polvo, mango
            antivibración y guarda ajustable sin herramientas.
          description: Descripción detallada
        imagen:
          type: string
          example: https://images.unsplash.com/photo-1504148455328-c376907d081c
          description: URL de la imagen del producto
        precioNeto:
          type: number
          minimum: 0
          example: 50000
          description: Precio neto sin impuestos en pesos chilenos (CLP)
        precioVenta:
          type: number
          minimum: 0
          example: 59500
          description: Precio de venta con IVA 19% (si se omite, se calcula automáticamente)
        stockActual:
          type: number
          minimum: 0
          example: 15
          description: Stock actual en inventario
        stockMinimo:
          type: number
          minimum: 0
          example: 5
          description: Stock mínimo permitido
        stockBajo:
          type: number
          minimum: 0
          example: 10
          description: Stock bajo de advertencia
        stockAlto:
          type: number
          minimum: 0
          example: 50
          description: Stock máximo/alto objetivo
      required:
        - sku
        - nombre
        - descripcionCorta
        - descripcionLarga
        - imagen
        - precioNeto
        - stockActual
        - stockMinimo
        - stockBajo
        - stockAlto
    UpdateProductDto:
      type: object
      properties:
        sku:
          type: string
          example: FIX-101
          description: Código SKU único del producto
        nombre:
          type: string
          example: Esmeril Angular 4-1/2 850W
        descripcionCorta:
          type: string
          example: Descripción corta actualizada
        descripcionLarga:
          type: string
          example: Descripción detallada actualizada
        imagen:
          type: string
          example: https://images.unsplash.com/photo-1504148455328-c376907d081c
        precioNeto:
          type: number
          minimum: 0
          example: 55000
        precioVenta:
          type: number
          minimum: 0
          example: 65450
        stockActual:
          type: number
          minimum: 0
          example: 20
        stockMinimo:
          type: number
          minimum: 0
          example: 5
        stockBajo:
          type: number
          minimum: 0
          example: 10
        stockAlto:
          type: number
          minimum: 0
          example: 50
    CreateClientDto:
      type: object
      properties:
        rutEmpresa:
          type: string
          example: 76.123.456-7
          description: RUT chileno de la empresa cliente
        rubro:
          type: string
          example: Construcción e Ingeniería
          description: Giro o rubro comercial
        razonSocial:
          type: string
          example: Constructora Los Andes SpA
          description: Razón social
        telefono:
          type: string
          example: +56 9 8765 4321
          description: Teléfono de contacto
        direccion:
          type: string
          example: Av. Providencia 1234, Of. 501, Santiago
          description: Dirección física
        nombreContacto:
          type: string
          example: Carlos Mendoza
          description: Nombre de la persona de contacto
        emailContacto:
          type: string
          format: email
          example: cmendoza@losandes.cl
          description: Correo electrónico de contacto
      required:
        - rutEmpresa
        - rubro
        - razonSocial
        - telefono
        - direccion
        - nombreContacto
        - emailContacto
    UpdateClientDto:
      type: object
      properties:
        rutEmpresa:
          type: string
          example: 76.123.456-7
        rubro:
          type: string
          example: Construcción e Ingeniería
        razonSocial:
          type: string
          example: Constructora Los Andes SpA
        telefono:
          type: string
          example: +56 9 8765 4321
        direccion:
          type: string
          example: Av. Providencia 1234, Of. 501, Santiago
        nombreContacto:
          type: string
          example: Carlos Mendoza
        emailContacto:
          type: string
          format: email
          example: cmendoza@losandes.cl
